[project]
name = "randomimage"
version = "1.0.0"
description = "What happens when you feed random data to an image generator?"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "boto3>=1.42",
    "google-genai>=2.22",
    "openai>=3.8",
    "pillow>=12.3",
]

[project.scripts]
randomimage = "randomimage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
